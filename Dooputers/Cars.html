    </head>
    <body>
        <!--Header/Navbar-->
        <header>
            <nav class="navbar section-content">

                <a href="index.html" class="nav-logo">

                <ul class="nav-menu">

                    <li class="nav-item">

                    <li class="nav-item">

                    <li class="nav-item">

                </ul>
            </nav>

        <main>
            <section class="main-section">

                <!-- container for the image gallery -->
                    <div class="container">

                        <div class="mySlides">
                            <div class="numbertext">1 / 4</div>
                            <img src="Pictures/Cars/IMG_0091.JPG" width="100%">
                        </div>
                    
                        <div class="mySlides">
                            <div class="numbertext">2 / 4</div>
                            <img src="Pictures/Cars/IMG_0092.JPG" width="100%">
                        </div>

                        <div class="mySlides">
                            <div class="numbertext">3 / 4</div>
                            <img src="Pictures/Cars/IMG_0093.JPG" width="100%">
                        </div>

                        <div class="mySlides">
                            <div class="numbertext">4 / 4</div>
                            <img src="Pictures/Cars/IMG_0090.JPG" width="100%">
                        </div>

                        <!-- next and previous buttons -->
                        <a class="prev" onclick="plusSlides(-1)">&#10094</a>
                        <a class="next" onclick="plusSlides(1)">&#10095</a>
                    
                        <div class="caption-container">
                            <p id="caption"></p>
                        </div>
                        <!-- Thumbnail images -->
                        <div class="row">
                            
                            <div class="column">
                                <img class="demo cursor" src="Pictures/Cars/IMG_0091.JPG" style="width: 100%"
                                onclick="currentSlide(1)" alt="Radio I installed">
                            </div>

                            <div class="column">
                                <img class="demo cursor" src="Pictures/Cars/IMG_0092.JPG" style="width: 100%"
                                onclick="currentSlide(2)" alt="Spliced new harness with solder and added heat shrinks">
                            </div>

                            <div class="column">
                                <img class="demo cursor" src="Pictures/Cars/IMG_0093.JPG" style="width: 100%"
                                onclick="currentSlide(3)" alt="Spliced new harness with solder and added heat shrinks">
                            </div>

                            <div class="column">
                                <img class="demo cursor" src="Pictures/Cars/IMG_0090.JPG" style="width: 100%"
                                onclick="currentSlide(4)" alt="New Drive Belt I installed ">
                            </div>
                        </div>
                    </div>
            </section>
        </main>
        <!-- Linking script file -->
        <script src="Cars.js" async></script>
